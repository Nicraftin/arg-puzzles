<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARG puzzles</title>
<style>
  :root {
    --bg: #0f0f0f;
    --panel: #1b1b1b;
    --line: #3a3a3a;
    --text: #ececec;
    --muted: #9a9a9a;
    --bright: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", system-ui, sans-serif;
    line-height: 1.5;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 20px;
  }
  h1 { margin: 0 0 6px; font-size: 1.9rem; text-align: center; }
  #timer {
    margin: 0 0 24px;
    text-align: center;
    font-family: Consolas, Menlo, "Courier New", monospace;
    font-size: 1.6rem;
    color: var(--bright);
  }
  #start-screen { text-align: center; padding-top: 30vh; }
  #start-screen button { padding: 14px 40px; font-size: 1.3rem; }

  .row {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .row label { display: block; margin-bottom: 10px; font-weight: bold; }
  .inputs { display: flex; gap: 10px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 6px;
  }
  input:focus { outline: none; border-color: var(--text); }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: bold;
    color: #111;
    background: var(--text);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  button:disabled, input:disabled { opacity: 0.6; cursor: default; }

  .status { min-height: 1.5em; margin: 8px 0 0; font-size: 0.95rem; }
  .status.good { color: var(--bright); }
  .status.bad { color: var(--muted); }
  /* "Incorrect" stays visible for a moment, then fades out. */
  .status.fade { animation: fadeOut 1.8s ease-out forwards; }
  @keyframes fadeOut {
    0%, 50% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* A solved puzzle box pulses once, then keeps a white outline. */
  .row.solved {
    box-shadow:
      inset 0 0 0 2px var(--text),
      0 0 18px rgba(255, 255, 255, 0.12),
      0 0 0 14px rgba(255, 255, 255, 0);
    animation: solvedPulse 0.9s ease-out;
  }
  @keyframes solvedPulse {
    0% {
      transform: scale(1);
      box-shadow:
        inset 0 0 0 0 var(--bright),
        0 0 0 rgba(255, 255, 255, 0),
        0 0 0 0 rgba(255, 255, 255, 0.6);
    }
    30% {
      transform: scale(1.025);
      box-shadow:
        inset 0 0 0 2px var(--bright),
        0 0 30px rgba(255, 255, 255, 0.4),
        0 0 0 5px rgba(255, 255, 255, 0.3);
    }
    100% {
      transform: scale(1);
      box-shadow:
        inset 0 0 0 2px var(--text),
        0 0 18px rgba(255, 255, 255, 0.12),
        0 0 0 14px rgba(255, 255, 255, 0);
    }
  }

  #done {
    margin-top: 26px;
    padding: 18px;
    text-align: center;
    font-size: 1.3rem;
    font-weight: bold;
    color: #111;
    background: var(--text);
    border-radius: 10px;
  }

  /* Black overlay: fades to black on Start, shows the countdown, then fades away. */
  #curtain {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #curtain.on {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.4s ease;
  }
  #count {
    font-size: 7rem;
    font-weight: bold;
    color: var(--text);
    opacity: 0;
  }
  #count.flash { animation: countFlash 0.9s ease-out forwards; }
  @keyframes countFlash {
    0%   { opacity: 0; transform: scale(0.85); }
    20%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.15); }
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div id="start-screen">
    <button id="start" type="button">Start</button>
  </div>

  <div id="game" hidden>
    <h1>Color + Noun → Answer</h1>
    <p id="timer">00:00.000</p>
    <div id="rows"></div>
    <div id="done" hidden>Congratulations! You got all 4 correct.</div>
  </div>
</main>
<div id="curtain" aria-hidden="true"><div id="count"></div></div>

<script>
  // Answers are stored as hashes, so they can't be read from this page.
  // "hashes" lists every accepted answer for that puzzle.
  // "contains: true" means the answer counts if any single word matches
  // (so "Henry Dunant" works for puzzle 3).
  const SALT = "nicraftin-arg:";
  const ANSWERS = [
    {
      prompt: `A "Gaster colored thing" in a hay stack also sounds like this.`,
      hashes: ["fea80294e9bb5b8fc1b0f0052e84de08a73809e469f47123f3f0137c6ef29acd"],
      contains: false
    },
    {
      prompt: `This #5C6D7C needs help improving on Reddit, they're fighting against this skin.`,
      hashes: [
        "80a62a9b1f91857fc089a24f3192947bfc13e4033f2eec7db6edc3141484803e",  // undying
        "4b44b4e2253305275d184865b72c209a2860f6d3240a0c2002e22bb1bf6b8290"   // undying mirage
      ],
      contains: false
    },
    {
      prompt: `The father of the U' D L' U U D D L U' D L.`,
      hashes: ["7485e93dd353d1bacde1779aff6837a0f222f79e10dcb2ea3be3d2ba5b2ad0b1"],
      contains: true
    },
    {
      prompt: `Wordle games go like: HUMAN WAVES HUMAN OCEAN HUMAN, SAILS SAILS SAILS SAILS HUMAN, VALVE SAILS VALVE SAILS VALVE. The answer is the original ALBUM.`,
      hashes: ["f7cc7ec9a26dca8c0e19b254b47cf9ebba7daaf9e976c3b8c181b88df06d6390"],
      contains: false
    }
  ];

  const solved = new Array(ANSWERS.length).fill(false);

  // ---- Sounds ----
  // Correct and incorrect answers use built-in beeps made with code.
  // Your files are used for two moments:
  //   sndIncorrect.wav -> each step of the countdown
  //   sndCorrect.wav   -> finishing the last puzzle
  // Both files go in the same folder as this page. If one is missing,
  // a built-in beep plays instead.
  const files = {
    tick: new Audio("sndIncorrect.wav"),
    finish: new Audio("sndCorrect.wav")
  };
  let audioCtx = null;

  function getAudioContext() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function beep(name) {
    try {
      const ctx = getAudioContext();
      if (ctx.state === "suspended") ctx.resume();
      const good = name === "correct";
      const notes = good ? [660, 880] : [180, 140];
      notes.forEach((freq, n) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t = ctx.currentTime + n * 0.12;
        osc.type = good ? "sine" : "sawtooth";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      });
    } catch (error) { /* no sound available */ }
  }

  function playFile(key, fallbackBeep) {
    const audio = files[key];
    audio.currentTime = 0;
    audio.play().catch(() => beep(fallbackBeep));
  }

  // Some browsers (Safari especially) only allow sound after a click,
  // so the Start button quietly "unlocks" audio for the rest of the visit.
  function unlockAudio() {
    Object.values(files).forEach(audio => {
      audio.muted = true;
      audio.play()
        .then(() => { audio.pause(); audio.currentTime = 0; audio.muted = false; })
        .catch(() => { audio.muted = false; });
    });
    try { getAudioContext().resume(); } catch (error) { /* ignore */ }
  }

  // Lowercase, remove accents, collapse extra spaces, trim.
  function clean(text) {
    return text
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();
  }

  async function hash(text) {
    const bytes = new TextEncoder().encode(SALT + text);
    const buffer = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(buffer))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function isCorrect(input, answer) {
    const text = clean(input);
    if (!text) return false;
    if (answer.hashes.includes(await hash(text))) return true;
    if (answer.contains) {
      for (const word of text.split(/[^a-z0-9]+/)) {
        if (word && answer.hashes.includes(await hash(word))) return true;
      }
    }
    return false;
  }

  // ---- Timer ----
  // Shows 00:00.000, and 1:00:00.000 once an hour has passed.
  const timerEl = document.getElementById("timer");
  let startTime = 0;
  let timerFrame = 0;

  function formatTime(ms) {
    const pad = (n, len) => String(n).padStart(len, "0");
    const total = Math.floor(ms);
    const millis = total % 1000;
    const totalSeconds = Math.floor(total / 1000);
    const seconds = totalSeconds % 60;
    const totalMinutes = Math.floor(totalSeconds / 60);
    const minutes = totalMinutes % 60;
    const hours = Math.floor(totalMinutes / 60);
    const text = pad(minutes, 2) + ":" + pad(seconds, 2) + "." + pad(millis, 3);
    return hours > 0 ? hours + ":" + text : text;
  }

  function updateTimer() {
    timerEl.textContent = formatTime(performance.now() - startTime);
  }

  function tickTimer() {
    updateTimer();
    timerFrame = requestAnimationFrame(tickTimer);
  }

  function startTimer() {
    startTime = performance.now();
    tickTimer();
  }

  function stopTimer() {
    cancelAnimationFrame(timerFrame);
    updateTimer();
  }

  // ---- Puzzle rows ----
  const rows = document.getElementById("rows");

  ANSWERS.forEach((answer, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<label for="answer' + i + '"></label>' +
      '<div class="inputs">' +
        '<input id="answer' + i + '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<button type="button">Check</button>' +
      '</div>' +
      '<p class="status" aria-live="polite"></p>';
    rows.appendChild(row);

    const label = row.querySelector("label");
    const input = row.querySelector("input");
    const button = row.querySelector("button");
    const status = row.querySelector(".status");

    label.textContent = answer.prompt;

    // Clear the message once the fade-out has finished.
    status.addEventListener("animationend", () => {
      status.textContent = "";
      status.className = "status";
    });

    function showIncorrect() {
      // Restart the fade every time, so each press visibly does something.
      status.className = "status bad";
      status.textContent = "Incorrect";
      void status.offsetWidth;
      status.classList.add("fade");
      beep("incorrect");
    }

    async function check() {
      try {
        if (await isCorrect(input.value, answer)) {
          solved[i] = true;
          status.textContent = "Correct!";
          status.className = "status good";
          input.disabled = true;
          button.disabled = true;
          row.classList.add("solved");
          if (solved.every(Boolean)) {
            stopTimer();
            playFile("finish", "correct");
            document.getElementById("done").hidden = false;
          } else {
            beep("correct");
          }
        } else {
          showIncorrect();
        }
      } catch (error) {
        status.className = "status bad";
        status.textContent = "Something went wrong. Try opening the page in a different browser.";
      }
    }

    button.addEventListener("click", check);
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  });

  // ---- Animated background ----
  // Gray squares drift upward in the left and right margins.
  (function () {
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    const SHADES = ["#ffffff", "#d0d0d0", "#a0a0a0", "#707070", "#4a4a4a"];
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w = 0, h = 0, pieces = [], last = 0;

    // Pick a spot in the left or right margin, around the centered column.
    function sideX() {
      const margin = Math.max(80, w / 2 - 240);
      const offset = Math.random() * margin;
      return Math.random() < 0.5 ? offset : w - offset;
    }

    function makePiece(anywhere) {
      return {
        x: sideX(),
        y: anywhere ? Math.random() * h : h + 40,
        size: 10 + Math.random() * 26,
        speed: 14 + Math.random() * 30,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.6,
        sway: 8 + Math.random() * 18,
        phase: Math.random() * Math.PI * 2,
        color: SHADES[Math.floor(Math.random() * SHADES.length)],
        alpha: 0.1 + Math.random() * 0.25
      };
    }

    function resize() {
      const oldWidth = w;
      const dpr = window.devicePixelRatio || 1;
      w = document.documentElement.clientWidth;
      h = document.documentElement.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!pieces.length || w !== oldWidth) {
        const count = Math.min(48, Math.round(w / 32));
        pieces = Array.from({ length: count }, () => makePiece(true));
      }
      if (reduceMotion) draw(0);
    }

    function draw(time) {
      ctx.clearRect(0, 0, w, h);
      for (const p of pieces) {
        const x = p.x + Math.sin(time / 1000 * 0.6 + p.phase) * p.sway;
        // Fade pieces near the middle column so they never compete with the text.
        const fade = Math.min(1, Math.max(0.12, (Math.abs(x - w / 2) - 250) / 110));
        const s = p.size;
        ctx.save();
        ctx.globalAlpha = p.alpha * fade;
        ctx.translate(x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-s / 2, -s / 2, s, s, s * 0.2);
        else ctx.rect(-s / 2, -s / 2, s, s);
        ctx.fill();
        ctx.restore();
      }
    }

    function frame(time) {
      const dt = Math.min(0.05, (time - last) / 1000 || 0);
      last = time;
      for (const p of pieces) {
        p.y -= p.speed * dt;
        p.angle += p.spin * dt;
        if (p.y < -40) Object.assign(p, makePiece(false));
      }
      draw(time);
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    if (!reduceMotion) requestAnimationFrame(frame);
  })();

  // ---- Start button: fade to black, countdown, fade in the puzzles ----
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function runIntro() {
    const curtain = document.getElementById("curtain");
    const count = document.getElementById("count");

    curtain.classList.add("on");
    await sleep(450);
    document.getElementById("start-screen").hidden = true;
    document.getElementById("game").hidden = false;

    for (const word of ["3", "2", "1", "Go!"]) {
      count.textContent = word;
      count.classList.remove("flash");
      void count.offsetWidth;
      count.classList.add("flash");
      playFile("tick", "incorrect");
      await sleep(1000);
    }

    curtain.classList.remove("on");   // fades the black overlay away
    startTimer();
    document.getElementById("answer0").focus();
  }

  document.getElementById("start").addEventListener("click", event => {
    event.currentTarget.disabled = true;
    unlockAudio();
    runIntro();
  });
</script>
</body>
</html>
