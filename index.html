<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARG puzzles</title>
<style>
  :root {
    --bg: #15132a;
    --panel: #201d3d;
    --text: #ece8fa;
    --muted: #a9a3c9;
    --accent: #f2c14e;
    --good: #7be0a4;
    --bad: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", system-ui, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 20px;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }
  h1 { margin: 0 0 6px; font-size: 1.9rem; text-align: center; }
  #timer {
    margin: 0 0 24px;
    font-size: 1.4rem;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  #start-screen { text-align: center; padding-top: 30vh; }
  #start-screen button { padding: 14px 40px; font-size: 1.3rem; }
  .row {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .row label { display: block; margin-bottom: 10px; font-weight: bold; }
  .inputs { display: flex; gap: 10px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    border: 2px solid #3a3666;
    border-radius: 6px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: bold;
    color: #1b1730;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  button:disabled, input:disabled { opacity: 0.6; cursor: default; }
  .status { min-height: 1.5em; margin: 8px 0 0; font-size: 0.95rem; }
  .status.good { color: var(--good); }
  .status.bad { color: var(--bad); }
  /* "Incorrect" stays fully visible for a moment, then fades out. */
  .status.fade { animation: fadeOut 2.5s ease-out forwards; }
  @keyframes fadeOut {
    0%, 60% { opacity: 1; }
    100% { opacity: 0; }
  }
  #done {
    margin-top: 26px;
    padding: 18px;
    text-align: center;
    font-size: 1.3rem;
    font-weight: bold;
    color: #1b1730;
    background: var(--good);
    border-radius: 10px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div id="start-screen">
    <button id="start" type="button">Start</button>
  </div>

  <div id="game" hidden>
    <h1>Color + Noun → Answer</h1>
    <p id="timer">0:00.0</p>
    <div id="rows"></div>
    <div id="done" hidden>Congratulations! You got all 4 correct.</div>
  </div>
</main>

<script>
  // Answers are stored as hashes, so they can't be read from this page.
  // "hashes" lists every accepted answer for that puzzle.
  // "contains: true" means the answer counts if any single word matches
  // (so "Henry Dunant" works for puzzle 3).
  const SALT = "nicraftin-arg:";
  const ANSWERS = [
    {
      prompt: `A "Gaster colored thing" in a hay stack also sounds like this.`,
      hashes: ["fea80294e9bb5b8fc1b0f0052e84de08a73809e469f47123f3f0137c6ef29acd"],
      contains: false
    },
    {
      prompt: `This #5C6D7C needs help improving on Reddit, they're fighting against this skin.`,
      hashes: [
        "80a62a9b1f91857fc089a24f3192947bfc13e4033f2eec7db6edc3141484803e",  // undying
        "4b44b4e2253305275d184865b72c209a2860f6d3240a0c2002e22bb1bf6b8290"   // undying mirage
      ],
      contains: false
    },
    {
      prompt: `The father of the U' D L' U U D D L U' D L.`,
      hashes: ["7485e93dd353d1bacde1779aff6837a0f222f79e10dcb2ea3be3d2ba5b2ad0b1"],
      contains: true
    },
    {
      prompt: `Wordle games go like: HUMAN WAVES HUMAN OCEAN HUMAN, SAILS SAILS SAILS SAILS HUMAN, VALVE SAILS VALVE SAILS VALVE. The answer is the original ALBUM.`,
      hashes: ["f7cc7ec9a26dca8c0e19b254b47cf9ebba7daaf9e976c3b8c181b88df06d6390"],
      contains: false
    }
  ];

  const solved = new Array(ANSWERS.length).fill(false);

  // ---- Sounds ----
  // Uses sndCorrect.wav and sndIncorrect.wav from the same folder as this page.
  // If a file is missing or can't play, a simple built-in beep plays instead.
  const sounds = {
    correct: new Audio("sndCorrect.wav"),
    incorrect: new Audio("sndIncorrect.wav")
  };
  let audioCtx = null;

  function getAudioContext() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function beep(name) {
    try {
      const ctx = getAudioContext();
      const good = name === "correct";
      const notes = good ? [660, 880] : [180, 140];
      notes.forEach((freq, n) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t = ctx.currentTime + n * 0.12;
        osc.type = good ? "sine" : "sawtooth";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      });
    } catch (error) { /* no sound available */ }
  }

  function playSound(name) {
    const audio = sounds[name];
    audio.currentTime = 0;
    audio.play().catch(() => beep(name));
  }

  // Some browsers (Safari especially) only allow sound after a click,
  // so the Start button quietly "unlocks" audio for the rest of the visit.
  function unlockAudio() {
    Object.values(sounds).forEach(audio => {
      audio.muted = true;
      audio.play()
        .then(() => { audio.pause(); audio.currentTime = 0; audio.muted = false; })
        .catch(() => { audio.muted = false; });
    });
    try { getAudioContext().resume(); } catch (error) { /* ignore */ }
  }

  // Lowercase, remove accents, collapse extra spaces, trim.
  function clean(text) {
    return text
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();
  }

  async function hash(text) {
    const bytes = new TextEncoder().encode(SALT + text);
    const buffer = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(buffer))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function isCorrect(input, answer) {
    const text = clean(input);
    if (!text) return false;
    if (answer.hashes.includes(await hash(text))) return true;
    if (answer.contains) {
      for (const word of text.split(/[^a-z0-9]+/)) {
        if (word && answer.hashes.includes(await hash(word))) return true;
      }
    }
    return false;
  }

  // ---- Timer ----
  const timerEl = document.getElementById("timer");
  let startTime = 0;
  let timerId = null;

  function formatTime(ms) {
    const tenths = Math.floor(ms / 100) % 10;
    const totalSeconds = Math.floor(ms / 1000);
    const seconds = totalSeconds % 60;
    const minutes = Math.floor(totalSeconds / 60);
    return minutes + ":" + String(seconds).padStart(2, "0") + "." + tenths;
  }

  function updateTimer() {
    timerEl.textContent = formatTime(performance.now() - startTime);
  }

  function startTimer() {
    startTime = performance.now();
    updateTimer();
    timerId = setInterval(updateTimer, 100);
  }

  function stopTimer() {
    clearInterval(timerId);
    updateTimer();
  }

  // ---- Puzzle rows ----
  const rows = document.getElementById("rows");

  ANSWERS.forEach((answer, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<label for="answer' + i + '"></label>' +
      '<div class="inputs">' +
        '<input id="answer' + i + '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<button type="button">Check</button>' +
      '</div>' +
      '<p class="status" aria-live="polite"></p>';
    rows.appendChild(row);

    const label = row.querySelector("label");
    const input = row.querySelector("input");
    const button = row.querySelector("button");
    const status = row.querySelector(".status");

    label.textContent = answer.prompt;

    // Clear the message once the fade-out has finished.
    status.addEventListener("animationend", () => {
      status.textContent = "";
      status.className = "status";
    });

    function showIncorrect() {
      // Restart the fade every time, so each press visibly does something.
      status.className = "status bad";
      status.textContent = "Incorrect";
      void status.offsetWidth;
      status.classList.add("fade");
      playSound("incorrect");
    }

    async function check() {
      try {
        if (await isCorrect(input.value, answer)) {
          solved[i] = true;
          status.textContent = "Correct!";
          status.className = "status good";
          input.disabled = true;
          button.disabled = true;
          playSound("correct");
          if (solved.every(Boolean)) {
            stopTimer();
            document.getElementById("done").hidden = false;
          }
        } else {
          showIncorrect();
        }
      } catch (error) {
        status.className = "status bad";
        status.textContent = "Something went wrong. Try opening the page in a different browser.";
      }
    }

    button.addEventListener("click", check);
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  });

  // ---- Animated background ----
  // Colored squares drift upward in the left and right margins.
  (function () {
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    const COLORS = ["#e5484d", "#f2c14e", "#4c8dff", "#3fbf7f", "#ff9a3d", "#ece8fa"];
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w = 0, h = 0, pieces = [], last = 0;

    // Pick a spot in the left or right margin, around the centered column.
    function sideX() {
      const margin = Math.max(80, w / 2 - 240);
      const offset = Math.random() * margin;
      return Math.random() < 0.5 ? offset : w - offset;
    }

    function makePiece(anywhere) {
      return {
        x: sideX(),
        y: anywhere ? Math.random() * h : h + 40,
        size: 10 + Math.random() * 26,
        speed: 14 + Math.random() * 30,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.6,
        sway: 8 + Math.random() * 18,
        phase: Math.random() * Math.PI * 2,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        alpha: 0.18 + Math.random() * 0.3
      };
    }

    function resize() {
      const oldWidth = w;
      const dpr = window.devicePixelRatio || 1;
      w = document.documentElement.clientWidth;
      h = document.documentElement.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!pieces.length || w !== oldWidth) {
        const count = Math.min(48, Math.round(w / 32));
        pieces = Array.from({ length: count }, () => makePiece(true));
      }
      if (reduceMotion) draw(0);
    }

    function draw(time) {
      ctx.clearRect(0, 0, w, h);
      for (const p of pieces) {
        const x = p.x + Math.sin(time / 1000 * 0.6 + p.phase) * p.sway;
        // Fade pieces near the middle column so they never compete with the text.
        const fade = Math.min(1, Math.max(0.12, (Math.abs(x - w / 2) - 250) / 110));
        const s = p.size;
        ctx.save();
        ctx.globalAlpha = p.alpha * fade;
        ctx.translate(x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-s / 2, -s / 2, s, s, s * 0.2);
        else ctx.rect(-s / 2, -s / 2, s, s);
        ctx.fill();
        ctx.restore();
      }
    }

    function frame(time) {
      const dt = Math.min(0.05, (time - last) / 1000 || 0);
      last = time;
      for (const p of pieces) {
        p.y -= p.speed * dt;
        p.angle += p.spin * dt;
        if (p.y < -40) Object.assign(p, makePiece(false));
      }
      draw(time);
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    if (!reduceMotion) requestAnimationFrame(frame);
  })();

  // ---- Start button ----
  document.getElementById("start").addEventListener("click", () => {
    unlockAudio();
    document.getElementById("start-screen").hidden = true;
    document.getElementById("game").hidden = false;
    startTimer();
    document.getElementById("answer0").focus();
  });
</script>
</body>
</html>
